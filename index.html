<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>مشغل يوتيوب</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #0f0c29, #302b63, #24243e);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .app-container {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 36px;
            padding: 24px 20px 30px;
            max-width: 800px;
            width: 100%;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .header-icon {
            font-size: 32px;
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            width: 48px;
            height: 48px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            box-shadow: 0 8px 16px rgba(255, 65, 108, 0.3);
        }

        .header h1 {
            color: #ffffff;
            font-size: 24px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .header h1 span {
            background: linear-gradient(135deg, #f093fb, #f5576c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .input-section {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .input-section input {
            flex: 1;
            min-width: 200px;
            padding: 14px 18px;
            border: none;
            border-radius: 60px;
            background: rgba(255, 255, 255, 0.10);
            backdrop-filter: blur(4px);
            color: #fff;
            font-size: 16px;
            outline: 2px solid transparent;
            transition: 0.3s;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.2);
        }

        .input-section input::placeholder {
            color: rgba(255, 255, 255, 0.45);
            font-weight: 300;
        }

        .input-section input:focus {
            outline-color: #f5576c;
            background: rgba(255, 255, 255, 0.15);
        }

        .input-section button {
            padding: 14px 28px;
            border: none;
            border-radius: 60px;
            background: linear-gradient(135deg, #f093fb, #f5576c);
            color: #fff;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(245, 87, 108, 0.3);
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .input-section button:hover {
            transform: scale(1.02);
            box-shadow: 0 12px 28px rgba(245, 87, 108, 0.5);
        }

        .input-section button:active {
            transform: scale(0.96);
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 */
            border-radius: 24px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .info-text {
            margin-top: 16px;
            color: rgba(255, 255, 255, 0.35);
            font-size: 14px;
            text-align: center;
            letter-spacing: 0.3px;
        }

        .info-text a {
            color: #f5576c;
            text-decoration: none;
        }

        @media (max-width: 480px) {
            .app-container { padding: 16px; }
            .header h1 { font-size: 20px; }
            .input-section button { padding: 12px 20px; font-size: 14px; }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <div class="header-icon">▶</div>
            <h1>مشغل <span>YouTube</span></h1>
        </div>

        <div class="input-section">
            <input type="text" id="videoUrl" placeholder="ألصق رابط يوتيوب هنا ..." />
            <button id="loadBtn">▶ تشغيل</button>
        </div>

        <div class="video-wrapper" id="videoWrapper">
            <iframe
                id="videoFrame"
                src="https://tube.rvere.com/embed?v=jNBqY7E8Ce8"
                title="مشغل فيديو"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen>
            </iframe>
        </div>

        <div class="info-text">
            <span>💡 أدخل رابط يوتيوب ثم اضغط تشغيل</span>
        </div>
    </div>

    <script>
        (function() {
            const input = document.getElementById('videoUrl');
            const btn = document.getElementById('loadBtn');
            const iframe = document.getElementById('videoFrame');

            // دالة لاستخراج معرف الفيديو من الرابط
            function extractVideoId(url) {
                if (!url) return null;
                // معالجة الروابط المختصرة youtu.be
                let match = url.match(/youtu\.be\/([^?&]+)/);
                if (match) return match[1];

                // روابط youtube.com/watch?v=
                match = url.match(/[?&]v=([^&]+)/);
                if (match) return match[1];

                // روابط embed
                match = url.match(/\/embed\/([^?&]+)/);
                if (match) return match[1];

                // إذا كان الرابط يحتوي على معرف مباشر (مثل jNBqY7E8Ce8)
                // نتحقق من طوله 11 حرفاً (معرفات يوتيوب)
                const trimmed = url.trim();
                if (trimmed.length === 11 && /^[a-zA-Z0-9_-]{11}$/.test(trimmed)) {
                    return trimmed;
                }
                return null;
            }

            function loadVideo() {
                const rawUrl = input.value.trim();
                if (!rawUrl) {
                    alert('الرجاء إدخال رابط يوتيوب.');
                    return;
                }

                let videoId = extractVideoId(rawUrl);
                if (!videoId) {
                    // قد يكون المستخدم وضع الرابط كاملاً للتضمين مباشرة
                    // نحاول استخدامه كما هو إذا كان يحتوي على embed
                    if (rawUrl.includes('embed')) {
                        iframe.src = rawUrl;
                        return;
                    }
                    alert('رابط غير صالح. تأكد من نسخ الرابط الصحيح.');
                    return;
                }

                // بناء رابط التضمين باستخدام الخدمة tube.rvere.com (كما في المثال)
                const embedUrl = `https://tube.rvere.com/embed?v=${videoId}`;
                iframe.src = embedUrl;
            }

            // تشغيل عند الضغط على الزر
            btn.addEventListener('click', loadVideo);

            // تشغيل عند الضغط على Enter
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    loadVideo();
                }
            });

            // تحميل الفيديو الافتراضي (إذا كان موجوداً) تلقائياً
            // لكن نتركه على المثال الموجود
        })();
    </script>
</body>
</html>
