name: 🚀 Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:   # يسمح بتشغيل يدوي من واجهة GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install Cordova
        run: npm install -g cordova

      - name: 🏗️ Create Cordova project
        run: |
          cordova create myapp com.example.myapp "YouTube Player"
          # نسخ ملف index.html إلى مجلد www
          cp index.html myapp/www/index.html

      - name: ⚙️ Adjust config.xml (optional)
        run: |
          cd myapp
          # إضافة اسم التطبيق و السماح بالوصول إلى الإنترنت (موجود افتراضياً)
          sed -i 's/MyApp/مشغل يوتيوب/g' config.xml
          # إضافة إذن الإنترنت صراحة (اختياري)
          sed -i '/<widget /a \    <allow-intent href="http://*/*" />\n    <allow-intent href="https://*/*" />' config.xml
          cd ..

      - name: ➕ Add Android platform
        working-directory: myapp
        run: cordova platform add android@latest

      - name: 🔨 Build debug APK
        working-directory: myapp
        run: cordova build android --debug

      - name: 📤 Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: myapp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
